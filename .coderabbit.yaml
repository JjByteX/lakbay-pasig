# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: en-US
early_access: false

reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: true
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - main

  path_filters:
    - "!**/package-lock.json"
    - "!**/*.svg"
    - "!public/**"
    - "!src/assets/**"
    - "!src/components/ui/**"
    - "!**/*.d.ts"

  path_instructions:
    - path: "supabase/migrations/**"
      instructions: |
        Migrations are pushed to the live Supabase project on merge to main.
        Check that every new table enables row level security and has explicit
        policies, that policies do not rely on user-editable JWT metadata, that
        security definer functions set a fixed search_path, and that nothing
        drops or rewrites existing data without a safe path. Flag anything that
        would be hard to roll back.
    - path: "supabase/functions/**"
      instructions: |
        Edge functions run with elevated privileges. Check that the caller is
        authenticated and authorized for the exact action, that all input is
        validated, that service role keys never reach the response or logs, and
        that errors do not leak internals. create-staff-account creates accounts,
        so review it as security-critical.
    - path: "src/**/*.{ts,tsx}"
      instructions: |
        Follow project-foundation/ux-ui-guidelines.md. Flag raw color values,
        Tailwind default palette colors, font weights above 600, emojis, icons
        outside @phosphor-icons/react, inline SVG icons, single-side colored
        borders, glow effects, gradients on structural surfaces, arbitrary
        radius or font-size values, and cards nested inside cards. Also flag
        missing loading, empty, error or disabled states on new interactive UI.
    - path: ".github/workflows/**"
      instructions: |
        Check for least-privilege permissions, secrets exposed to untrusted pull
        request code, and third-party actions that are not pinned.

chat:
  auto_reply: true
