sonar.projectKey=JjByteX_lakbay-pasig
sonar.organization=jjbytex
sonar.projectName=Lakbay Pasig

# Source root. No test directory exists yet (see build-order.md step 11 /
# no test framework in package.json), so sonar.tests is left unset rather
# than pointed at a folder that doesn't exist.
sonar.sources=src

# Keep generated/vendor output and unowned shadcn primitives out of the
# scan. src/components/ui is the shadcn/ui-generated component set
# (components.json), not hand-authored app code.
sonar.exclusions=**/node_modules/**,**/dist/**,**/*.d.ts,src/components/ui/**

# TypeScript/JavaScript analysis
sonar.sourceEncoding=UTF-8
sonar.typescript.tsconfigPath=tsconfig.app.json
